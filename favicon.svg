<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#1a1a1a"/>
  <!-- Three concentric ring dots at 12 o'clock — the PlaybackRings motif -->
  <circle cx="16" cy="4"  r="1.8" fill="rgba(255,255,255,0.85)"/>
  <circle cx="16" cy="9"  r="1.5" fill="#f5c97a"/>
  <circle cx="16" cy="13" r="1.2" fill="#a8c4e0"/>
  <!-- Faint ring tracks -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
  <circle cx="16" cy="16" r="7"  fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
  <circle cx="16" cy="16" r="3"  fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
</svg>
